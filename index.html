<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro Ben's 3D Printer Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #29292e;
        }
        h1 { color: #00b37e; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #8d8d99; margin-top: 0; font-size: 14px; margin-bottom: 25px; }
        .target-box { background: #202024; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .amount { font-size: 36px; font-weight: bold; color: #fff; margin: 10px 0; }
        .progress-container { background-color: #29292e; border-radius: 10px; height: 24px; width: 100%; overflow: hidden; margin-bottom: 25px; }
        .progress-bar { background: linear-gradient(90deg, #00b37e, #00e6a0); height: 100%; width: 0%; transition: width 0.5s ease; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #c4c4cc; font-size: 14px; }
        input { width: 100%; padding: 10px; background-color: #121214; border: 1px solid #29292e; border-radius: 6px; color: #fff; font-size: 16px; box-sizing: border-box; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-add { background-color: #00b37e; color: #fff; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-add:hover { background-color: #008f64; }
        .btn-quick { background-color: #29292e; color: #c4c4cc; }
        .btn-quick:hover { background-color: #323238; color: #fff; }
        .btn-reset { background-color: #aa2222; color: #fff; grid-column: span 2; margin-top: 15px; font-size: 12px; padding: 6px; opacity: 0.6; }
        .btn-reset:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Maestro Ben's Tracker</h1>
    <p class="subtitle">Bambu Lab A1 Savings Goal</p>
    
    <div class="target-box">
        <div>Current Savings</div>
        <div class="amount" id="current-display">\$0.00</div>
        <div style="color: #8d8d99; font-size: 13px;">Target: \$429.00 AUD</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="input-group">
        <label for="amount-input">Add Custom Amount (\$)</label>
        <input type="number" id="amount-input" placeholder="0.00" min="0" step="0.01">
        <button class="btn-add" onclick="addCustomAmount()">Add to Savings</button>
    </div>

    <div class="btn-grid">
        <button class="btn-quick" onclick="quickAdd(5)">+ \$5 (Pocket Money)</button>
        <button class="btn-quick" onclick="quickAdd(20)">+ \$20 (Song Royalties)</button>
        <button class="btn-quick" onclick="quickAdd(50)">+ \$50 (Birthday Cash)</button>
        <button class="btn-quick" onclick="quickAdd(100)">+ \$100 (Big Win)</button>
        <button class="btn-reset" onclick="resetSavings()">Reset Tracker to \$0</button>
            <div class="btn-grid">
        <button class="btn-quick" onclick="quickAdd(0.05)" style="background-color: #707075; color: #fff;">🪙 + 5c</button>
        <button class="btn-quick" onclick="quickAdd(0.10)" style="background-color: #85858a; color: #fff;">🪙 + 10c</button>
        <button class="btn-quick" onclick="quickAdd(0.20)" style="background-color: #9da0a5; color: #fff;">🪙 + 20c</button>
        <button class="btn-quick" onclick="quickAdd(0.50)" style="background-color: #b0b5bc; color: #fff;">🪙 + 50c</button>
        <button class="btn-quick" onclick="quickAdd(1.00)" style="background-color: #d4af37; color: #121214;">💰 + $1 Gold</button>
        <button class="btn-quick" onclick="quickAdd(2.00)" style="background-color: #aa7c11; color: #121214;">💰 + $2 Gold</button>
        <button class="btn-quick" onclick="quickAdd(1.00)" style="background-color: #d4a373; color: #121214; grid-column: span 2;">🤬 + $1 Parent Swear!</button>
        <button class="btn-reset" onclick="resetSavings()">Reset Tracker to $0</button>
    </div>
</div>

<script>
    const targetGoal = 429.00;
    let currentSavings = parseFloat(localStorage.getItem('bambu_savings')) || 0.00;

    function updateUI() {
        document.getElementById('current-display').innerText = `$${currentSavings.toFixed(2)}`;
        let percentage = (currentSavings / targetGoal) * 100;
        if (percentage > 100) percentage = 100;
        document.getElementById('progress-bar').style.width = `${percentage}%`;
        localStorage.setItem('bambu_savings', currentSavings);
    }

    function addCustomAmount() {
        const input = document.getElementById('amount-input');
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) {
            currentSavings += val;
            input.value = '';
            updateUI();
        }
    }

    function quickAdd(amount) {
        currentSavings += amount;
        updateUI();
    }

    function resetSavings() {
        if (confirm("Are you sure you want to reset your savings back to \$0?")) {
            currentSavings = 0.00;
            updateUI();
        }
    }

    // Initial load
    updateUI();
</script>

</body>
</html>
